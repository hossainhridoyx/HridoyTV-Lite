<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HridoyTV Live Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="w-full max-w-4xl bg-black rounded-3xl overflow-hidden shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] border border-slate-800 relative group">
        <video id="video" controls class="w-full aspect-video object-contain" autoplay playsinline preload="auto"></video>
    </div>

    <script>
        const video = document.getElementById('video');
        
        // ⚠️ আপনার ক্লাউডফ্লেয়ার ওয়ার্কারের ফাইনাল M3U8 লিংকটি এখানে বসান
        const streamUrl = 'https://YOUR_WORKER_SUBDOMAIN.workers.dev/channel_key.m3u8'; 

        if (Hls.isSupported()) {
            const hls = new Hls({
                maxBufferLength: 10,         
                maxMaxBufferLength: 20,
                liveSyncDurationCount: 3,    
                enableWorker: true,
                lowLatencyMode: true,
                // ⭐ অত্যন্ত গুরুত্বপূর্ণ: এটি ব্রাউজার থেকে ওয়ার্কারে কুকি পাস করবেই করবে
                xhrSetup: function (xhr, url) {
                    xhr.withCredentials = true; 
                }
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play().catch(e => console.log("Autoplay blocked by browser:", e));
            });

            // প্লেয়ার ক্র্যাশ করা রোধে অটো-রিকভারি লজিক
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log("Network error encountered, trying to recover...");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log("Media error encountered, trying to recover...");
                            hls.recoverMediaError();
                            break;
                        default:
                            console.log("Unrecoverable error, restarting player...");
                            hls.loadSource(streamUrl);
                            break;
                    }
                }
            });
        } 
        // iOS / Safari ব্রাউজারের জন্য নেটিভ সাপোর্ট
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function () {
                video.play();
            });
        }
    </script>
</body>
</html>
