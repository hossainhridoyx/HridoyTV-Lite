<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HridoyTV Premium Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .plyr { border-radius: 1.5rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-900 bg-slate-900/50 backdrop-blur px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight text-white">Hridoy<span class="text-green-500">TV</span></h1>
            <span class="px-3 py-1 bg-green-500/10 border border-green-500/20 rounded-full text-xs font-semibold text-green-400 flex items-center gap-1.5">
                <span class="h-1.5 w-1.5 rounded-full bg-green-500 animate-pulse"></span> Encrypted Stream
            </span>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-4xl space-y-4">
            
            <div class="relative bg-slate-900 border border-slate-800 rounded-[2rem] p-3 sm:p-4">
                <video id="player" controls crossorigin playsinline class="w-full h-full aspect-video"></video>
                
                <div id="statusOverlay" class="absolute inset-0 bg-slate-950/90 rounded-[2rem] flex flex-col items-center justify-center gap-3 z-50 transition-all duration-300">
                    <div id="statusSpinner" class="w-10 h-10 border-4 border-green-500/30 border-t-green-500 rounded-full animate-spin"></div>
                    <p id="statusText" class="text-sm font-medium text-slate-400">Requesting secure session token...</p>
                </div>
            </div>

            <div class="px-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                    <h2 class="text-lg font-bold text-white">Channel i Live Stream</h2>
                    <p class="text-xs text-slate-400">Powered by Secure Anti-Leech Protection System</p>
                </div>
                <button onclick="requestSecureStream()" class="text-xs font-semibold text-green-400 bg-green-500/10 border border-green-500/20 px-4 py-2 rounded-xl hover:bg-green-500/20 active:scale-95 transition-all">
                    🔄 Reload Stream
                </button>
            </div>

        </div>
    </main>

    <footer class="text-center py-6 text-xs text-slate-600 border-t border-slate-900">
        &copy; 2026 HRIDOYTV.TOP - All Rights Reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

    <script>
        // ⚠️ আপনার কনফিগারেশন এখানে লিখুন:
        const workerDomain = "https://jbd.hossainhridoy.workers.dev"; // আপনার ওয়ার্কার ডোমেইন
        const channelKey = "channeli"; // KV-তে সেভ করা চ্যানেলের নাম (এক্সটেনশন ছাড়া)

        const video = document.getElementById('player');
        const overlay = document.getElementById('statusOverlay');
        const spinner = document.getElementById('statusSpinner');
        const statusText = document.getElementById('statusText');
        let plyrInstance = null;
        let hlsInstance = null;

        // ওয়ার্কার থেকে ওয়ান-টাইম সিকিউর লিংক আনার মেইন ফাংশন
        function requestSecureStream() {
            showStatus("Securing dynamic endpoint token...", false);
            
            fetch(`${workerDomain}/get-link/${channelKey}`, {
                method: 'GET',
                headers: { 'Origin': window.location.origin } // ব্রাউজার এটি পাঠায় অটোমেটিক
            })
            .then(response => {
                if (!response.ok) throw new Error("HTTP verification failed. Status: " + response.status);
                return response.json();
            })
            .then(data => {
                if (data.url) {
                    hideStatus();
                    startVideoPlayback(data.url);
                } else if (data.error) {
                    showStatus("Error: " + data.error, true);
                }
            })
            .catch(err => {
                console.error(err);
                showStatus("Unauthorized access or connection refused.", true);
            });
        }

        // প্লেয়ার ইনিশিয়ালাইজেশন এবং প্লেব্যাক স্টার্ট
        function startVideoPlayback(secureUrl) {
            // পূর্বের সেশন থাকলে তা রিলিজ করা
            if (hlsInstance) hlsInstance.destroy();

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    maxBufferLength: 10,
                    liveDurationInfinity: true
                });
                hlsInstance.loadSource(secureUrl);
                hlsInstance.attachMedia(video);
                
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    if (!plyrInstance) plyrInstance = new Plyr(video, { controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'] });
                    video.play().catch(() => {}); // অটো-প্লে ট্রাই
                });

                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        showStatus("Playback session terminated. Reload stream.", true);
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari বা iOS ব্রাউজারের জন্য সরাসরি প্লেব্যাক
                video.src = secureUrl;
                if (!plyrInstance) plyrInstance = new Plyr(video);
            }
        }

        // ইউজার ইন্টারফেস স্ট্যাটাস হ্যান্ডলার
        function showStatus(msg, isError) {
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            statusText.innerText = msg;
            if (isError) {
                spinner.classList.add('hidden');
                statusText.classList.add('text-red-400');
            } else {
                spinner.classList.remove('hidden');
                statusText.classList.remove('text-red-400');
            }
        }

        function hideStatus() {
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        // পেজ লোড হলেই স্ট্রিমিং সেশন রিকোয়েস্ট শুরু হবে
        document.addEventListener("DOMContentLoaded", requestSecureStream);
    </script>
</body>
</html>
