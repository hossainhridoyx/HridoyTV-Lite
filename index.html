<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HridoyTV Live - Fixed Playlist</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #22c55e; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                <h1 class="text-xl font-black tracking-wider text-green-500">HRIDOY<span class="text-white">TV</span></h1>
            </div>
            <span id="live-badge" class="text-xs bg-green-500/10 text-green-400 px-3 py-1 rounded-full font-bold border border-green-500/20">STABLE</span>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <div class="lg:col-span-3 flex flex-col gap-4">
            <div class="relative rounded-2xl overflow-hidden bg-black aspect-video border border-slate-800 shadow-2xl">
                <video id="video" controls class="w-full h-full object-contain hidden" autoplay playsinline preload="auto"></video>
                <div id="placeholder-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 p-6 text-center z-20">
                    <div id="loading-spinner" class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p id="status-text" class="text-sm sm:text-base text-slate-400 font-medium">চ্যানেল কানেক্ট করা হচ্ছে...</p>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <h2 id="current-channel-title" class="text-lg font-bold text-white">লোডিং...</h2>
                <p class="text-xs text-slate-400 mt-1">HridoyTV Secure Proxy Active</p>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col h-[400px] lg:h-auto max-h-[600px]">
            <div class="mb-3 pb-2 border-b border-slate-800">
                <h3 class="font-bold text-sm tracking-wide text-slate-400 uppercase">📺 চ্যানেল লিস্ট</h3>
            </div>
            <div id="channel-list-container" class="flex-1 overflow-y-auto space-y-2 pr-1">
                </div>
        </div>
    </main>

    <script>
        // 🚀 আপনার আসল ওয়ার্কার লিঙ্ক
        const workerBaseUrl = 'https://jbd.hossainhridoy.workers.dev';

        // 🛠️ আপনার রিকোয়েস্ট করা ৩টি চ্যানেল এখানে ফিক্সড করে দেওয়া হলো
        const channels = [
            { name: "Channel I", slug: "channeli" },
            { name: "Citizen TV", slug: "citizentv" },
            { name: "EPTV", slug: "eptv" }
        ];

        const video = document.getElementById('video');
        const placeholderScreen = document.getElementById('placeholder-screen');
        const loadingSpinner = document.getElementById('loading-spinner');
        const statusText = document.getElementById('status-text');
        const currentChannelTitle = document.getElementById('current-channel-title');
        const channelListContainer = document.getElementById('channel-list-container');
        let hls = null;

        // ১. স্ক্রিনে চ্যানেল বাটন তৈরি করা
        function renderChannelList() {
            channelListContainer.innerHTML = '';
            channels.forEach((channel) => {
                const btn = document.createElement('button');
                btn.id = `btn-${channel.slug}`;
                btn.className = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl border transition-all duration-200 text-left font-medium text-sm group bg-slate-950/40 border-slate-800/60 text-slate-300 hover:bg-slate-800 hover:border-slate-700';
                btn.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-slate-600 group-hover:bg-green-400 transition-colors"></span>
                    <span class="flex-1 truncate">${channel.name}</span>
                `;
                btn.onclick = () => playChannel(channel);
                channelListContainer.appendChild(btn);
            });
        }

        // ২. সিলেক্টেড চ্যানেল প্লে করা
        function playChannel(channel) {
            channels.forEach(c => {
                const b = document.getElementById(`btn-${c.slug}`);
                if(b) b.className = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl border transition-all duration-200 text-left font-medium text-sm group bg-slate-950/40 border-slate-800/60 text-slate-300 hover:bg-slate-800 hover:border-slate-700';
            });
            
            const activeBtn = document.getElementById(`btn-${channel.slug}`);
            if(activeBtn) activeBtn.className = 'w-full flex items-center gap-3 px-4 py-3 rounded-xl border transition-all duration-200 text-left font-medium text-sm group bg-green-500/10 border-green-500/30 text-green-400';

            placeholderScreen.classList.remove('hidden');
            loadingSpinner.classList.remove('hidden');
            video.classList.add('hidden');
            statusText.textContent = `${channel.name} লোড হচ্ছে...`;
            currentChannelTitle.textContent = channel.name;

            // এটি সরাসরি জেনারেট করবে: https://jbd.hossainhridoy.workers.dev/channeli.m3u8
            const finalStreamUrl = `${workerBaseUrl}/${channel.slug}.m3u8`;

            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls({
                    maxBufferLength: 10, maxMaxBufferLength: 20, liveSyncDurationCount: 3, enableWorker: true, lowLatencyMode: true,
                    xhrSetup: function (xhr) { xhr.withCredentials = true; }
                });
                hls.loadSource(finalStreamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    placeholderScreen.classList.add('hidden');
                    video.classList.remove('hidden');
                    video.play().catch(() => console.log("Autoplay Blocked"));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); }
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
                        else { showErrorState("লিংকটি কাজ করছে না অথবা টোকেন এক্সপায়ারড।"); }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = finalStreamUrl;
                video.addEventListener('loadedmetadata', () => {
                    placeholderScreen.classList.add('hidden');
                    video.classList.remove('hidden');
                    video.play();
                });
            }
        }

        function showErrorState(msg) {
            loadingSpinner.classList.add('hidden');
            placeholderScreen.classList.remove('hidden');
            video.classList.add('hidden');
            statusText.innerHTML = `<span class="text-red-500 font-bold">Error:</span> ${msg}`;
        }

        // পেজ লোড হলেই লিস্ট শো করবে এবং প্রথম চ্যানেল অন হবে
        renderChannelList();
        if(channels.length > 0) {
            playChannel(channels[0]);
        }
    </script>
</body>
</html>
