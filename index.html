<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HridoyTV - Premium Player</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://unpkg.com/video.js/dist/video-js.min.css" rel="stylesheet">
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(rgba(22, 163, 74, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* প্লেয়ারকে সুন্দর গোল ফ্রেম দেওয়া */
        .video-js {
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="min-h-[100dvh] bg-pattern flex flex-col items-center justify-center p-4 sm:p-6 selection:bg-green-500 selection:text-white">

    <div class="w-full max-w-3xl bg-white rounded-[2rem] shadow-[0_20px_40px_-15px_rgba(22,163,74,0.12)] border border-green-50 p-4 sm:p-6 text-center relative z-10">
        
        <div class="flex items-center justify-between mb-4 px-2">
            <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800 tracking-tight">
                Hridoy<span class="text-green-600">TV Live</span>
            </h1>
            <div id="status-badge" class="inline-flex items-center px-3 py-1 bg-amber-50 rounded-full border border-amber-200">
                <span class="relative flex h-2 w-2 mr-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                </span>
                <span id="status-text" class="text-xs text-amber-800 font-semibold">Connecting...</span>
            </div>
        </div>

        <div class="relative min-h-[220px] sm:min-h-[400px] w-full bg-slate-900 rounded-[1.5rem] flex items-center justify-center overflow-hidden">
            
            <div id="loading-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-20 transition-opacity duration-300">
                <div class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-slate-300 font-medium text-sm sm:text-base">Securing stream connection...</p>
                <p class="text-slate-500 text-xs mt-1">Generating one-time secure IP token</p>
            </div>

            <div id="error-screen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-slate-950 z-20 px-6 text-center">
                <div class="flex items-center justify-center w-14 h-14 rounded-2xl bg-red-950/50 text-red-500 border border-red-900/50 mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                </div>
                <h2 class="text-red-400 font-bold text-lg mb-1">Playback Unauthorized</h2>
                <p id="error-message" class="text-slate-400 text-xs sm:text-sm max-w-md leading-relaxed">Security handshake failed or token expired.</p>
                <button onclick="window.location.reload()" class="mt-5 px-5 py-2 bg-green-600 hover:bg-green-700 text-white text-xs font-semibold rounded-lg transition-all active:scale-95">
                    Retry Connection
                </button>
            </div>

            <video id="hridoy-player" class="video-js vjs-fluid vjs-theme-city" controls preload="auto" width="100%"></video>
        </div>

    </div>
    
    <div class="mt-8 text-slate-400 text-xs sm:text-sm font-medium tracking-wide flex items-center gap-2">
        <span>&copy; <span id="year"></span></span>
        <span class="w-1 h-1 rounded-full bg-slate-300"></span>
        <span class="text-green-600 font-bold tracking-wider">HRIDOYTV.TOP</span>
    </div>

    <script src="https://unpkg.com/video.js/dist/video.min.js"></script>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // ⚙️ কনফিগারেশন (আপনার ওয়ার্কারের লিংক এখানে দিন)
        const WORKER_DOMAIN = "https://jbd.hossainhridoy.workers.dev";
        
        // ইউআরএল থেকে অটোমেটিক চ্যানেলের নাম রিড করার লজিক (?ch=চ্যানেল_নাম)
        const urlParams = new URLSearchParams(window.location.search);
        let channelKey = urlParams.get('ch');

        // যদি ইউআরএলে কোনো চ্যানেল না দেওয়া থাকে, তবে ডিফল্ট হিসেবে 'deshitv.m3u8' প্লে হবে
        if (!channelKey) {
            channelKey = "deshitv.m3u8";
        }

        // প্লেয়ার ইনিশিয়ালাইজেশন
        const player = videojs('hridoy-player', {
            autoplay: true,
            fluid: true,
            liveui: true,
            responsive: true,
            loadingSpinner: true
        });

        // সিকিউর টোকেন আনা এবং ভিডিও প্লে করার মেইন ফাংশন
        async function initializeSecureStream() {
            const loadingScreen = document.getElementById('loading-screen');
            const errorScreen = document.getElementById('error-screen');
            const errorMessage = document.getElementById('error-message');
            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');

            try {
                // ১. ব্যাকগ্রাউন্ডে ওয়ার্কার থেকে ৩০ সেকেন্ডের শর্ট-লাইভড টোকেন আনা হচ্ছে
                const response = await fetch(`${WORKER_DOMAIN}/token/${channelKey}`);
                
                if (!response.ok) {
                    throw new Error("Worker rejected the request. Make sure domain whitelist is matching.");
                }
                
                const data = await response.json();
                const securePlayUrl = data.url; 

                // ২. ভিডিও প্লেয়ারে সিকিউর লিংকটি পুশ করা হচ্ছে
                player.src({
                    src: securePlayUrl,
                    type: 'application/vnd.apple.mpegurl'
                });

                // প্লেয়ার রেডি হলে লোডিং স্ক্রিন সরিয়ে দেওয়া হবে
                player.ready(function() {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => loadingScreen.classList.add('hidden'), 300);
                    
                    // স্ট্যাটাস পরিবর্তন
                    statusBadge.className = "inline-flex items-center px-3 py-1 bg-green-50 rounded-full border border-green-200";
                    statusText.className = "text-xs text-green-800 font-semibold";
                    statusText.textContent = "Secure Connected";
                });

                // কোনো কারণে প্লেয়ারের ভেতরে লোড হতে এরর আসলে (যেমন আইপি মিক্সম্যাচ)
                player.on('error', function() {
                    showError("Stream error or Token Expired! Please refresh the page.");
                });

            } catch (error) {
                showError(error.message || "Failed to fetch secure token from proxy server.");
            }
        }

        // এরর দেখানোর হেল্পার ফাংশন
        function showError(msg) {
            document.getElementById('loading-screen').classList.add('hidden');
            const errorScreen = document.getElementById('error-screen');
            const errorMessage = document.getElementById('error-message');
            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');
            
            errorScreen.classList.remove('hidden');
            errorMessage.textContent = msg;

            statusBadge.className = "inline-flex items-center px-3 py-1 bg-red-50 rounded-full border border-red-200";
            statusText.className = "text-xs text-red-800 font-semibold";
            statusText.textContent = "Disconnected";
        }

        // পেজ ওপেন হলেই প্রসেস রান হবে
        window.onload = initializeSecureStream;
    </script>
</body>
</html>
