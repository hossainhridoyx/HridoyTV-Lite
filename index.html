<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HridoyTV Lite - Premium Live Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(rgba(22, 163, 74, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* Custom aspect ratio for responsive video */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
        }
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="min-h-screen bg-pattern flex flex-col items-center p-4 sm:p-6 selection:bg-green-500 selection:text-white">

    <header class="w-full max-w-4xl text-center my-6">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight">
            Hridoy<span class="text-green-600">TV Lite</span>
        </h1>
        <p class="text-slate-500 text-sm sm:text-base mt-1 font-medium">Secure & Premium Live TV Player</p>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-2 bg-white rounded-3xl p-4 shadow-[0_20px_40px_-15px_rgba(22,163,74,0.08)] border border-green-50/50">
            <div class="video-container rounded-2xl overflow-hidden bg-black shadow-inner border border-slate-900">
                <video id="videoPlayer" controls autoplay playsinline preload="auto" class="w-full h-full"></video>
            </div>
            <div class="mt-4 flex items-center justify-between px-2">
                <div>
                    <h2 id="currentChannelName" class="text-lg font-bold text-slate-800">Select a Channel</h2>
                    <p class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        Secure Proxy Stream Active
                    </p>
                </div>
                <div class="text-xs font-semibold text-green-700 bg-green-50 px-3 py-1.5 rounded-full border border-green-100">
                    HD Quality
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-5 shadow-[0_20px_40px_-15px_rgba(22,163,74,0.08)] border border-green-50/50 flex flex-col">
            <h3 class="text-base font-bold text-slate-800 mb-4 tracking-tight flex items-center gap-2">
                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                </svg>
                Channel Playlist
            </h3>
            
            <div class="space-y-2.5 overflow-y-auto max-h-[350px] pr-1">
                
                <button onclick="loadSecureStream('channeli.m3u8', 'Channel I HD')" class="channel-btn w-full flex items-center gap-3 p-3 rounded-xl border border-slate-100 hover:border-green-200 hover:bg-green-50/30 text-left transition-all duration-200 active:scale-[0.98]">
                    <div class="w-10 h-10 rounded-lg bg-green-50 border border-green-100 flex items-center justify-center font-bold text-green-600 text-sm">
                        CH
                    </div>
                    <div>
                        <p class="font-semibold text-slate-700 text-sm">Channel I HD</p>
                        <p class="text-xs text-slate-400">Bangla Live TV</p>
                    </div>
                </button>

                <button onclick="loadSecureStream('eptv.m3u8', 'EP TV HD')" class="channel-btn w-full flex items-center gap-3 p-3 rounded-xl border border-slate-100 hover:border-green-200 hover:bg-green-50/30 text-left transition-all duration-200 active:scale-[0.98]">
                    <div class="w-10 h-10 rounded-lg bg-green-50 border border-green-100 flex items-center justify-center font-bold text-green-600 text-sm">
                        EP
                    </div>
                    <div>
                        <p class="font-semibold text-slate-700 text-sm">EP TV HD</p>
                        <p class="text-xs text-slate-400">Live Entertainment</p>
                    </div>
                </button>

                </div>
        </div>

    </main>

    <footer class="mt-auto pt-10 pb-6 text-slate-400 text-xs sm:text-sm font-medium tracking-wide flex items-center gap-2">
        <span>&copy; <span id="year"></span></span>
        <span class="w-1 h-1 rounded-full bg-slate-300"></span>
        <span class="text-green-600 font-bold tracking-wider">HRIDOYTVLITE.PAGES.DEV</span>
    </footer>

    <script>
        // অটোমেটিক বছর সেট করা
        document.getElementById('year').textContent = new Date().getFullYear();

        const video = document.getElementById('videoPlayer');
        const channelTitle = document.getElementById('currentChannelName');
        let hls = null;

        async function loadSecureStream(kvKey, displayName) {
            // UI আপডেট এবং লোডিং স্টেট দেখানোর জন্য
            channelTitle.textContent = `Loading ${displayName}...`;
            
            // অ্যাক্টিভ বাটনের স্টাইল চেঞ্জ করার লজিক (ঐচ্ছিক)
            document.querySelectorAll('.channel-btn').forEach(btn => {
                btn.classList.remove('border-green-500', 'bg-green-50/50');
            });
            event.currentTarget.classList.add('border-green-500', 'bg-green-50/50');

            try {
                // আপনার ক্লাউডফ্লেয়ার পেজেস ফাংশন এপিআই কল করা হচ্ছে
                const response = await fetch(`/api/getstream?key=${kvKey}`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (!data.url) {
                    throw new Error('Secure URL not found in API response');
                }

                const secureUrl = data.url;
                console.log("Playing:", secureUrl);

                // আগের HLS ইন্সট্যান্স থাকলে তা ডেস্ট্রয় করা
                if (hls) {
                    hls.destroy();
                }

                // Hls.js দিয়ে স্ট্রিম প্লে করা (ব্রাউজার যদি Native M3U8 সাপোর্ট না করে যেমন: Chrome/PC)
                if (Hls.isSupported()) {
                    hls = new Hls({
                        maxMaxBufferLength: 10, // ফাস্ট লোডিং এর জন্য বাফার অপ্টিমাইজেশন
                        enableWorker: true
                    });
                    hls.loadSource(secureUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log("Autoplay blocked, waiting for user click"));
                        channelTitle.textContent = displayName;
                    });
                    
                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            console.error("Fatal player error, trying to recover...");
                            channelTitle.textContent = "Stream Error! Reconnecting...";
                            hls.recoverMediaError();
                        }
                    });

                } 
                // সাফারি বা আইফোনের মতো ব্রাউজারে যেখানে ডিরেক্ট ম্যাপ করা যায়
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = secureUrl;
                    video.addEventListener('loadedmetadata', function() {
                        video.play();
                        channelTitle.textContent = displayName;
                    });
                } else {
                    channelTitle.textContent = "Your browser does not support HLS streaming.";
                }

            } catch (error) {
                console.error("Error loading stream:", error);
                channelTitle.textContent = "Failed to load channel. Try again.";
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে প্রথম চ্যানেলটি অটোমেটিক চালু করতে চাইলে নিচের লাইনটি আনকমেন্ট করতে পারেন
        // window.onload = () => loadSecureStream('channeli.m3u8', 'Channel I HD');
    </script>
</body>
</html>
